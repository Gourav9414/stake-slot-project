name: Math Engine Checks

on:
  push:
    branches: [feature/math-engine]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  math-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run reproducible 10,000-spin simulation
        run: python games/clockwork_kingdom/run.py --spins 10000 --seed 20261116

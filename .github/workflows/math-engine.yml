name: Math and Prototype Checks

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run math unit tests
        run: python -m unittest discover -s tests -v
      - name: Run reproducible 10,000-spin math simulation
        run: python games/clockwork_kingdom/run.py --spins 10000 --seed 20261116
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check frontend JavaScript syntax
        run: |
          node --check web/engine.js
          node --check web/app.js
      - name: Run frontend engine tests
        run: node --test tests/test_frontend.mjs
